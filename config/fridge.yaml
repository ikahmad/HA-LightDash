title: Fridge

lightdash:
  container_width: 1024px
  container_height: 768px
  theme: ha-dark
  auto_revert_seconds: 0
  auto_close_modal_seconds: 15

views:
  - title: Fridge
    path: fridge
    type: fixed-grid
    grid:
      rows: 20
      columns: 4
    cards:

      # ── Left column: Controls ─────────────────────────────────────────────

      - type: heading
        heading: Lighting
        grid_layout: {x: 0, y: 0, width: 2, height: 1}

      - type: tile
        entity: light.kitchen_main_lights
        name: Kitchen
        features_position: inline
        features:
          - type: light-brightness
        grid_layout: {x: 0, y: 1, width: 2, height: 2}

      - type: entities
        entities:
          - entity: cover.kitchen_roof
            name: Kitchen Roof
        grid_layout: {x: 0, y: 3, width: 2, height: 1}

      - type: heading
        heading: Downstairs
        grid_layout: {x: 0, y: 5, width: 1, height: 1}

      - type: entities
        entities:
          - entity: light.porch
          - entity: light.living_room_all_lights
            name: Living Room
          - entity: light.workshop
        grid_layout: {x: 0, y: 6, width: 1, height: 5}
      - type: entities
        entities:
          - entity: light.entryway
          - entity: light.dining_room
          - entity: light.garden
        grid_layout: {x: 1, y: 6, width: 1, height: 5}

      - type: heading
        heading: Climate & Heating
        grid_layout: {x: 0, y: 11, width: 1, height: 1}

      - type: tile
        entity: input_number.home_comfort_temperature
        name: Home
        features_position: inline
        features:
          - type: numeric-input
        grid_layout: {x: 0, y: 12, width: 2, height: 1}

      - type: tile
        entity: input_number.guest_room_comfort_temperature
        name: Guest Room
        features_position: inline
        features:
          - type: numeric-input
        grid_layout: {x: 0, y: 14, width: 2, height: 1}

      - type: tile
        entity: input_number.master_bedroom_comfort_temperature
        name: Master Bed
        features_position: inline
        features:
          - type: numeric-input
        grid_layout: {x: 0, y: 20, width: 2, height: 1}

      - type: entities
        entities:
          - entity: input_boolean.heating_guest_mode
          - entity: sensor.boiler_syspress
        grid_layout: {x: 0, y: 22, width: 2, height: 1}

      # ── Right column: Status & Info ───────────────────────────────────────

      - type: clock
        time_zone: Europe/London
        time_format: "24"
        clock_size: "500%"
        no_background: true
        lightdash:
          date_show: true
          date_format: locale
          date_fontsize: "250%"
        grid_layout: {x: 2, y: 0, width: 2, height: 4}

      - type: weather-forecast
        entity: weather.pirateweather
        forecast_type: hourly
        forecast_count: 8
        secondary_info_attribute: extrema
        grid_layout: {x: 2, y: 4, width: 2, height: 3}

      - type: custom:today-card
        title: Today
        show_past_events: false
        show_all_day_events: true
        time_format: "HH:mm"
        entities:
          - entity: calendar.rich_work
            color: blue
          - entity: calendar.emilie_leckiekershaw_com
            color: pink
          - entity: calendar.emmett_special
            color: green
          - entity: calendar.rich_personal
            color: purple
          - entity: calendar.family_schedule
            color: orange
          - entity: calendar.leckie_kershaw_gmail_com
        grid_layout: {x: 2, y: 9, width: 2, height: 5}

      - type: tile
        entity: sensor.joint_charles_cleared_balance
        name: Emmett's Pocket Money
        grid_layout: {x: 0, y: 16, width: 2, height: 2}